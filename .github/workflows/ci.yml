name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Quality (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: amd64
            runner: macos-13
          - os: macos
            arch: arm64
            runner: macos-14
          - os: windows
            arch: amd64
            runner: windows-latest
          - os: windows
            arch: arm64
            runner: windows-11-arm
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RUSTFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace

      - name: Run nextest
        run: cargo nextest run --workspace --all-features

      # nextest does not execute doctests; keep this as an independent hard gate.
      - name: Run doctests
        run: cargo test --doc --workspace --all-features

      - name: Build documentation
        shell: bash
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Prepare coverage output
        shell: bash
        run: mkdir -p coverage

      - name: Check xtask-todo-lib coverage
        shell: bash
        run: >-
          cargo llvm-cov -p xtask-todo-lib --all-features --json --summary-only
          --output-path coverage/xtask-todo-lib.json --fail-under-lines 95
          --ignore-filename-regex
          'crates[/\\]todo[/\\]src[/\\](bin[/\\].*|devshell[/\\](mod\.rs|repl[/\\].*|script[/\\](exec|parse)\.rs|vm[/\\].*|command[/\\]types\.rs|sandbox[/\\](linux_mount|elf|paths|run|sync)\.rs|host_text\.rs|completion[/\\].*|workspace[/\\].*|command[/\\]dispatch[/\\](builtin_impl|workspace)\.rs|vfs[/\\]tree\.rs|session_store\.rs))|xtask[/\\].*'
          -- --test-threads=1

      - name: Check xtask coverage
        shell: bash
        run: >-
          cargo llvm-cov -p xtask --all-features --json --summary-only
          --output-path coverage/xtask.json --fail-under-lines 95
          --ignore-filename-regex
          'xtask[/\\]src[/\\](main\.rs|bin[/\\]todo\.rs|lima_todo[/\\].*|gh\.rs|ghcr\.rs|acceptance[/\\].*)|crates[/\\]todo[/\\].*'
          -- --test-threads=1 --include-ignored

      - name: Upload coverage JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/*.json
          if-no-files-found: ignore

      - name: Check dependency policy
        if: always()
        run: cargo deny check

      - name: Check RustSec advisories
        if: always()
        run: cargo audit
