# Lint policy: each member crate defines [lints.clippy] in its own Cargo.toml (e.g. all = "warn").
# Virtual workspaces cannot set [lints] at root; see crates/todo/Cargo.toml and xtask/Cargo.toml.

[workspace]
resolver = "2"
members = ["crates/todo", "crates/devshell-vm", "xtask"]

[profile.release]
# Optimize distributable binaries for size. `strip = "symbols"` keeps source
# and line information out of the shipped binary; use a debug build for local
# diagnosis and preserve the measured commit/configuration in the baseline.
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
